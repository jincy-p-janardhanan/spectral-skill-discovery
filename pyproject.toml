[project]
name = "spectral-skill-discovery"
version = "0.1.0"
description = "Spectral Skill Discovery (SSD): ordered, decorrelated skill representations with a permutation-tested intrinsic dimension."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.14.0",
    "numpy>=2.5.3",
    "gymnasium[mujoco]>=1.3.0",
    "mujoco>=3.14.0",
    "matplotlib>=3.11.2",
    "tensorboard>=2.21.0",
    "imageio[ffmpeg]>=2.37.4",
    "pillow>=12.3.0",
    "dm-control>=1.0.47",
    "gymnasium-robotics>=1.4.2",
    "numpy-quaternion>=2024.0.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ssd"]

[tool.hatch.build.targets.wheel.force-include]
"ssd/assets" = "ssd/assets"

# the cluster's driver supports CUDA 12.8 at most
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
# labmaze (dm-control's maze tasks, unused) has no Python 3.14 wheel
override-dependencies = ["labmaze ; sys_platform == 'never'"]
